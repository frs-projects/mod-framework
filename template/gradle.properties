# ── Gradle ──────────────────────────────────────────────────────────────────
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G
org.gradle.parallel=true
org.gradle.caching=true
# Loom's remap/decompile tasks are not configuration-cache safe.
org.gradle.configuration-cache=false

# ── Mod identity ────────────────────────────────────────────────────────────
mod.id=examplemod
mod.name=Example Mod
mod.group=net.frsprojects.examplemod
mod.version=0.1.0
mod.license=All Rights Reserved
mod.description=One line describing the mod.
mod.authors=FRS-Projects
mod.source=https://github.com/frs-projects/examplemod
# Comma-separated mixin configs (Forge reads them from the manifest). Remove if unused.
mod.mixins=examplemod.mixins.json

# ── Toolchain ───────────────────────────────────────────────────────────────
# :core targets the lowest Java in the matrix (1.20.1 runs on Java 17).
core.java=17
