name: Mod build

# Reusable workflow every FRS-Projects mod calls from its own .github/workflows/build.yml
# (copy template/.github/workflows/build.yml). It tests :core once, builds and checks every
# node in parallel, and on a version tag publishes a GitHub Release with every node's jar.

on:
  workflow_call:
    inputs:
      mod-id:
        description: mod.id from gradle.properties; the jar file name prefix.
        required: true
        type: string
      title:
        description: Human-readable mod name, used for the release title.
        required: true
        type: string
      nodes:
        description: JSON array of Stonecutter nodes, e.g. '["1.20.1-forge", "1.21.1-neoforge"]'.
        required: true
        type: string
    secrets:
      FRAMEWORK_TOKEN:
        description: >-
          Token that can read frs-projects/mod-framework. Only needed while that repository is
          private: the default GITHUB_TOKEN can read the calling repository but not its submodules.
        required: false

jobs:
  core:
    name: core (no Minecraft)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.FRAMEWORK_TOKEN || github.token }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Loom refuses to set up Minecraft on a daemon older than the version
          # Minecraft itself requires, so the daemon runs on the newest in the matrix.
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :core:test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-test-results
          path: core/build/reports/tests/test/

  matrix:
    name: ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ${{ fromJSON(inputs.nodes) }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.FRAMEWORK_TOKEN || github.token }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      # `check` runs verifyModMetadata, which is the guard against shipping a jar
      # that builds but contains no loader metadata.
      - run: ./gradlew ":${{ matrix.node }}:build" ":${{ matrix.node }}:check"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.mod-id }}-${{ matrix.node }}
          path: versions/${{ matrix.node }}/build/libs/${{ inputs.mod-id }}-*.jar

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [core, matrix]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # A tag that disagrees with mod.version would publish jars named after a different
      # version than the release, so refuse it rather than ship the mismatch. Any non-digit
      # prefix on the tag (v, v., release-) is ignored; only the version number must match.
      - name: Check the tag matches mod.version
        run: |
          version=$(grep '^mod.version=' gradle.properties | cut -d= -f2)
          tag_version=$(echo "$GITHUB_REF_NAME" | sed 's/^[^0-9]*//')
          if [ "$tag_version" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match mod.version=$version"
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          pattern: ${{ inputs.mod-id }}-*
          path: dist
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          MOD_ID: ${{ inputs.mod-id }}
          TITLE: ${{ inputs.title }}
        run: |
          # Sources jars stay on the workflow run; the release carries what gets installed.
          find dist -name "$MOD_ID-*.jar" ! -name '*-sources.jar' -print0 \
            | xargs -0 gh release create "$GITHUB_REF_NAME" --title "$TITLE $GITHUB_REF_NAME" \
                --generate-notes
